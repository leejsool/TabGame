<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도트 색 합치기</title>
<style>
  :root { --bg: #f4f1ea; --card: #fff; --ink: #222; --mute: #777; --accent: #2d6cdf; --warn: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'NanumGothic', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 12px 18px; background: #263238; color: #fff; }
  header h1 { font-size: 18px; margin: 0; }
  main { display: grid; grid-template-columns: 200px 1fr 330px; gap: 14px; padding: 14px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 1px 4px #0001; }
  #list { max-height: calc(100vh - 90px); overflow: auto; }
  #list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; font: inherit; cursor: pointer; }
  #list button:hover { background: #eef; }
  #list button.on { background: var(--accent); color: #fff; }
  #list button:disabled { color: #aaa; cursor: default; background: none; }
  #list small { opacity: .7; }
  #list .group { font-weight: 800; font-size: 13px; color: #fff; background: #455a64; border-radius: 6px; padding: 4px 8px; margin: 12px 0 4px; }
  #picWrap { overflow: auto; max-height: calc(100vh - 150px); display: flex; justify-content: center; }
  canvas { image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 0; padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; background: #e8e8e8; }
  .tabs button.on { background: var(--accent); color: #fff; }
  h2 { font-size: 15px; margin: 4px 0 8px; }
  .hint { font-size: 12.5px; color: var(--mute); line-height: 1.5; margin: 0 0 10px; }
  .pal { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 64px; border: 2px solid transparent; border-radius: 10px; padding: 3px; cursor: pointer; position: relative; text-align: center; font-size: 11px; background: #fafafa; }
  .sw .c { height: 40px; border-radius: 7px; border: 1px solid #0002; }
  .sw .c.empty { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 12px 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--warn); }
  .sw.sel { border-color: var(--accent); background: #eaf1ff; }
  .row { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 5px 0; }
  .dot { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #0003; flex: none; }
  .btn { border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; background: #e8e8e8; }
  .btn.main { background: var(--accent); color: #fff; font-weight: 700; }
  .btn.warn { background: #fbe3e0; color: var(--warn); }
  .btn:disabled { opacity: .45; cursor: default; }
  .sug { cursor: pointer; border-radius: 8px; padding: 3px 4px; }
  .sug:hover { background: #f0f4ff; }
  #status { font-size: 13px; white-space: pre-wrap; max-height: 180px; overflow: auto; background: #f7f7f7; border-radius: 8px; padding: 8px; display: none; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sec { margin-top: 16px; }
  .only-merge, .only-paint { display: none; }
  body.merge .only-merge, body.paint .only-paint { display: block; }
</style>
</head>
<body class="merge">
<header><h1>도트 캐논 · 그림 색 고치기</h1></header>
<main>
  <div class="card" id="list"></div>
  <div class="card">
    <div class="tools">
      <div class="tabs"><button id="tabMerge" class="on">색 통째로 합치기</button><button id="tabPaint">칸 칠하기</button></div>
      <span style="margin-left:auto">크게 보기</span><input type="range" id="zoom" min="4" max="32" value="12">
    </div>
    <div id="picWrap"><canvas id="cv"></canvas></div>
  </div>
  <div>
    <div class="card">
      <h2 id="title">-</h2>
      <div class="row">묶음 <select id="theme"><option value="anime">애니메이션과 게임</option><option value="movie">영화</option><option value="art">명화</option></select></div>
      <p class="hint" id="pickHint"></p>
      <div class="pal" id="pal"></div>
      <div class="sec only-merge"><h2>비슷한 색 짝 (누르면 적은 쪽을 많은 쪽으로)</h2><div id="sug"></div></div>
      <div class="sec"><h2>이번에 고친 것</h2><div id="pending"></div></div>
      <div class="bar">
        <button class="btn" id="undo">하나 되돌리기</button>
        <button class="btn main" id="save">저장하고 그림 다시 만들기</button>
      </div>
    </div>
    <div class="card sec">
      <h2>예전에 저장한 것</h2>
      <div id="saved"></div>
      <div class="bar"><button class="btn warn" id="reset">이 그림 고친 것 모두 지우고 다시 만들기</button></div>
      <div class="sec" id="status"></div>
    </div>
  </div>
</main>
<script>
const EMPTY = -1;
let handmade = [], stages = [], cur = 0, ops = [], picked = null, building = false;
let extras = []; // 새로 넣은 색 (아직 칠하지 않았어도 붓으로 고를 수 있게)
let mode = 'merge', brush = null, stroke = null;
try { document.getElementById('zoom').value = localStorage.getItem('dotZoom') || 12; } catch (e) {}

function decode(runs) {
  const out = []; let i = 0;
  while (i < runs.length) {
    const ch = runs[i++]; let n = 0;
    while (i < runs.length && runs[i] >= '0' && runs[i] <= '9') n = n * 10 + (+runs[i++]);
    const c = ch === '.' ? EMPTY : ch.charCodeAt(0) - 97;
    for (let k = 0; k < n; k++) out.push(c);
  }
  return out;
}

// 지금 보이는 그림 = 저장된 그림 + 이번에 고친 것 (차례대로). 칸은 색 이름(RRGGBB)이나 '.'으로 다룬다.
function view() {
  const s = stages[cur];
  const base = decode(s.runs);
  let cells = base.map(p => p === EMPTY ? '.' : s.colors[p]);
  let palette = [...s.colors];
  const all = [...ops, ...(stroke ? [stroke] : [])];
  for (const op of all) {
    if (op.type === 'merge') {
      cells = cells.map(c => c === op.from ? op.to : c);
      palette = palette.filter(c => c !== op.from);
    } else {
      for (const [k, v] of Object.entries(op.cells)) {
        if (v !== '.' && !palette.includes(v)) palette.push(v); // 새 색
        const [x, y] = k.split(',').map(Number);
        cells[y * s.width + x] = v;
      }
    }
  }
  const count = {};
  cells.forEach(c => { if (c !== '.') count[c] = (count[c] || 0) + 1; });
  const colors = palette.filter(c => count[c]); // 안 쓰이게 된 색은 빠진다 (게임에서도)
  return { cells, colors, count, w: s.width, h: s.height };
}

function rgb(hex) { const n = parseInt(hex, 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function lab(hex) {
  const f = v => { v /= 255; return v > 0.04045 ? ((v + 0.055) / 1.055) ** 2.4 : v / 12.92; };
  const [r, g, b] = rgb(hex).map(f);
  const x = (r * .4124 + g * .3576 + b * .1805) / .95047, y = r * .2126 + g * .7152 + b * .0722, z = (r * .0193 + g * .1192 + b * .9505) / 1.08883;
  const t = v => v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116;
  return [116 * t(y) - 16, 500 * (t(x) - t(y)), 200 * (t(y) - t(z))];
}
function dist(a, b) { const p = lab(a), q = lab(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); }
function chip(c) { return c === '.' ? '<span class="dot" style="background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/8px 8px"></span>' : `<span class="dot" style="background:#${c}"></span>`; }

function drawPic(v) {
  const cv = document.getElementById('cv'), cell = +document.getElementById('zoom').value;
  cv.width = v.w * cell; cv.height = v.h * cell;
  const g = cv.getContext('2d');
  const focus = mode === 'merge' ? picked : null;
  for (let y = 0; y < v.h; y++) for (let x = 0; x < v.w; x++) {
    const c = v.cells[y * v.w + x];
    g.fillStyle = (x + y) % 2 ? '#e9e9e9' : '#f8f8f8';
    g.fillRect(x * cell, y * cell, cell, cell);
    if (c === '.') continue;
    g.globalAlpha = focus === null || c === focus ? 1 : 0.18;
    g.fillStyle = '#' + c;
    g.fillRect(x * cell, y * cell, cell, cell);
    g.globalAlpha = 1;
  }
  if (cell >= 10) { // 칸 줄
    g.strokeStyle = '#0000001a'; g.beginPath();
    for (let x = 1; x < v.w; x++) { g.moveTo(x * cell + .5, 0); g.lineTo(x * cell + .5, v.h * cell); }
    for (let y = 1; y < v.h; y++) { g.moveTo(0, y * cell + .5); g.lineTo(v.w * cell, y * cell + .5); }
    g.stroke();
  }
}

function draw() {
  const v = view(), s = stages[cur];
  document.body.className = mode;
  document.getElementById('tabMerge').className = mode === 'merge' ? 'on' : '';
  document.getElementById('tabPaint').className = mode === 'paint' ? 'on' : '';
  drawPic(v);
  const themeLabel = (THEMES.find(t => t[0] === s.theme) || THEMES[2])[1];
  document.getElementById('title').textContent = `${themeLabel} ${numberOf(cur)}번 ${s.name} — 색 ${v.colors.length}개 (${v.w}×${v.h})`;
  document.getElementById('theme').value = s.theme;
  if (brush && brush !== '.' && !v.colors.includes(brush) && !extras.includes(brush)) brush = null;
  document.getElementById('pickHint').textContent = mode === 'merge'
    ? (picked === null ? '없앨 색을 먼저 누르세요. (그림의 점을 눌러도 돼요)' : `#${picked} 을(를) 어느 색으로 합칠까요? 다른 색을 누르세요. (같은 색을 다시 누르면 취소)`)
    : (brush === null ? '칠할 색을 고르세요. "빈 칸"으로 칠하면 그 칸은 부술 타일이 없어져요.' : '그림 위를 누르거나 끌어서 칠하세요. 오른쪽 클릭하면 그 칸 색을 붓으로 집어요.');
  const pal = document.getElementById('pal'); pal.innerHTML = '';
  const sel = mode === 'merge' ? picked : brush;
  const unused = mode === 'paint' ? extras.filter(c => !v.colors.includes(c)) : [];
  for (const c of [...v.colors, ...unused, ...(mode === 'paint' ? ['.'] : [])]) {
    const d = document.createElement('div');
    d.className = 'sw' + (c === sel ? ' sel' : '');
    d.innerHTML = c === '.' ? '<div class="c empty">✕</div>빈 칸' : `<div class="c" style="background:#${c}"></div>${v.count[c] || 0}칸${s.colors.includes(c) ? '' : ' 새'}`;
    d.title = c === '.' ? '투명 (타일 없음)' : '#' + c;
    d.onclick = () => mode === 'merge' ? pick(c) : (brush = brush === c ? null : c, draw());
    pal.appendChild(d);
  }
  if (mode === 'paint') { // 새 색 넣기: 색을 고르면 붓이 그 색이 된다
    const d = document.createElement('label');
    d.className = 'sw'; d.title = '그림에 없는 색을 새로 넣어요';
    d.innerHTML = '<div class="c empty" style="color:var(--accent)">＋</div>새 색<input type="color" id="newColor" style="position:absolute;opacity:0;width:0;height:0">';
    pal.appendChild(d);
    d.querySelector('input').addEventListener('change', e => {
      const hex = e.target.value.slice(1).toUpperCase();
      if (!view().colors.includes(hex) && !extras.includes(hex)) extras.push(hex);
      brush = hex; draw();
    });
  }
  const pairs = [];
  for (let i = 0; i < v.colors.length; i++) for (let j = i + 1; j < v.colors.length; j++) pairs.push([dist(v.colors[i], v.colors[j]), v.colors[i], v.colors[j]]);
  pairs.sort((a, b) => a[0] - b[0]);
  const sug = document.getElementById('sug'); sug.innerHTML = '';
  for (const [d, a, b] of pairs.slice(0, 6)) {
    const [from, to] = v.count[a] <= v.count[b] ? [a, b] : [b, a];
    const row = document.createElement('div');
    row.className = 'row sug';
    row.innerHTML = `${chip(from)}${v.count[from]}칸 → ${chip(to)}${v.count[to]}칸 <small style="color:#999">차이 ${d.toFixed(0)}</small>`;
    row.onclick = () => merge(from, to);
    sug.appendChild(row);
  }
  const pend = document.getElementById('pending');
  pend.innerHTML = ops.length ? '' : '<p class="hint">아직 없어요.</p>';
  for (const op of ops) {
    pend.innerHTML += op.type === 'merge'
      ? `<div class="row">${chip(op.from)}→${chip(op.to)} 색 합치기</div>`
      : `<div class="row">${chip(op.brush)} ${Object.keys(op.cells).length}칸 칠하기</div>`;
  }
  const saved = document.getElementById('saved');
  saved.innerHTML = s.merge.length || s.paint ? '' : '<p class="hint">없어요.</p>';
  for (const [a, b] of s.merge) saved.innerHTML += `<div class="row">${chip(a)}→${chip(b)} 색 합치기</div>`;
  if (s.paint) saved.innerHTML += `<div class="row">칠한 칸 ${s.paint}개</div>`;
  document.getElementById('undo').disabled = !ops.length || building;
  document.getElementById('save').disabled = !ops.length || building;
  document.getElementById('reset').disabled = !(s.merge.length || s.paint) || building;
}

function pick(c) {
  if (picked === null) picked = c;
  else if (picked === c) picked = null;
  else { merge(picked, c); return; }
  draw();
}
function merge(a, b) {
  if (view().colors.length <= 2) { alert('색은 2개보다 줄일 수 없어요.'); return; }
  ops.push({ type: 'merge', from: a, to: b }); picked = null; draw();
}

// 그림 위 누르기·끌기
const cv = document.getElementById('cv');
function cellAt(e) {
  const r = cv.getBoundingClientRect(), s = stages[cur];
  const x = Math.floor((e.clientX - r.left) / r.width * s.width), y = Math.floor((e.clientY - r.top) / r.height * s.height);
  return x < 0 || y < 0 || x >= s.width || y >= s.height ? null : [x, y];
}
function paintAt(e) {
  const xy = cellAt(e); if (!xy || !stroke) return;
  const k = xy.join(',');
  if (stroke.cells[k] === brush) return;
  stroke.cells[k] = brush; drawPic(view());
}
cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  const xy = cellAt(e); if (!xy) return;
  const v = view(); brush = v.cells[xy[1] * v.w + xy[0]]; mode = 'paint'; draw();
});
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const xy = cellAt(e); if (!xy) return;
  const v = view(), c = v.cells[xy[1] * v.w + xy[0]];
  if (mode === 'merge') { if (c !== '.') pick(c); return; }
  if (brush === null) { alert('먼저 오른쪽에서 칠할 색을 고르세요.'); return; }
  cv.setPointerCapture(e.pointerId);
  stroke = { type: 'paint', brush, cells: {} }; paintAt(e);
});
cv.addEventListener('pointermove', e => { if (stroke) paintAt(e); });
function endStroke() {
  if (!stroke) return;
  if (Object.keys(stroke.cells).length) ops.push(stroke);
  stroke = null; draw();
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

const THEMES = [['anime', '애니메이션과 게임'], ['movie', '영화'], ['art', '명화']];

// 게임 메뉴와 같은 묶음·차례로 (손그림은 '애니메이션과 게임' 맨 앞, 번호는 묶음마다 1부터)
function list() {
  const el = document.getElementById('list'); el.innerHTML = '<p class="hint">게임 메뉴와 같은 묶음·차례예요.</p>';
  for (const [key, label] of THEMES) {
    const h = document.createElement('div');
    h.className = 'group'; h.textContent = label;
    el.appendChild(h);
    let n = 0;
    if (key === 'anime') handmade.forEach(name => {
      const b = document.createElement('button');
      b.disabled = true; b.title = '손으로 그린 그림이라 여기서는 고칠 수 없어요';
      b.innerHTML = `${++n}. ${name} <small>(손그림)</small>`;
      el.appendChild(b);
    });
    stages.forEach((s, i) => {
      if (s.theme !== key) return;
      const b = document.createElement('button');
      b.className = i === cur ? 'on' : '';
      b.innerHTML = `${++n}. ${s.name} <small>${s.colors.length}색</small>`;
      b.onclick = () => {
        if (ops.length && !confirm('저장하지 않은 것이 있어요. 버리고 다른 그림으로 갈까요?')) return;
        cur = i; ops = []; extras = []; picked = null; list(); draw();
      };
      el.appendChild(b);
    });
  }
}

// 지금 그림이 묶음 안에서 몇 번째인지 (게임 메뉴 번호)
function numberOf(i) {
  const t = stages[i].theme;
  let n = t === 'anime' ? handmade.length : 0;
  for (let k = 0; k <= i; k++) if (stages[k].theme === t) n++;
  return n;
}

async function load() {
  const j = await (await fetch('/api/stages')).json();
  handmade = j.handmade; stages = j.stages;
  cur = Math.min(cur, stages.length - 1);
  list(); draw();
}

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function rebuild() {
  building = true; draw();
  const st = document.getElementById('status');
  st.style.display = 'block'; st.textContent = `"${stages[cur].name}" 그림만 다시 만드는 중... (잠깐 걸려요)`;
  await post('/api/build', { name: stages[cur].name }); // 이 그림 하나만 다시 만든다
  for (;;) {
    await new Promise(r => setTimeout(r, 1500));
    const b = await (await fetch('/api/build')).json();
    const lines = b.log.split('\n').filter(l => /:\s\d+x\d+|건너뜀|풀리|Error|error|실행하지/.test(l)).map(l => l.replace(/^.*?\]\s*/, ''));
    st.textContent = (b.running ? '만드는 중...\n' : '') + lines.slice(-12).join('\n');
    if (!b.running) {
      st.textContent = (b.ok ? '✅ 다 만들었어요! 게임에 반영됐어요.\n' : '❌ 만들지 못했어요. 아래를 보세요 (고친 것 때문에 안 풀리면 "모두 지우고 다시 만들기"를 눌러 보세요).\n')
        + (b.ok ? lines.slice(-12) : b.log.split('\n').slice(-25)).join('\n');
      break;
    }
  }
  building = false; ops = []; extras = []; picked = null;
  await load();
}

document.getElementById('tabMerge').onclick = () => { mode = 'merge'; draw(); };
document.getElementById('tabPaint').onclick = () => { mode = 'paint'; picked = null; draw(); };
document.getElementById('theme').onchange = async e => {
  const s = stages[cur];
  if (ops.length) { alert('고친 것을 먼저 저장하거나 되돌린 뒤에 묶음을 바꿔 주세요.'); e.target.value = s.theme; return; }
  const label = e.target.options[e.target.selectedIndex].text;
  if (!confirm(`"${s.name}"을(를) "${label}" 묶음으로 옮길까요?`)) { e.target.value = s.theme; return; }
  try { await post('/api/theme', { name: s.name, theme: e.target.value }); await rebuild(); }
  catch (x) { alert('옮기지 못했어요: ' + x.message); }
};
document.getElementById('zoom').oninput = e => { try { localStorage.setItem('dotZoom', e.target.value); } catch (x) {} drawPic(view()); };
document.getElementById('undo').onclick = () => { ops.pop(); draw(); };
document.getElementById('save').onclick = async () => {
  const v = view();
  if (v.colors.length < 2) { alert('색이 2개 이상 남아 있어야 해요.'); return; }
  if (v.colors.length > 16) { alert('색은 16개까지만 쓸 수 있어요. 비슷한 색을 합쳐 주세요.'); return; }
  try { await post('/api/save', { name: stages[cur].name, ops: ops.map(o => o.type === 'merge' ? o : { type: 'paint', cells: o.cells }) }); await rebuild(); }
  catch (e) { alert('저장하지 못했어요: ' + e.message); }
};
document.getElementById('reset').onclick = async () => {
  if (!confirm(`"${stages[cur].name}"에 저장한 것을 모두 지우고 원래 그림으로 다시 만들까요?`)) return;
  try { ops = []; await post('/api/reset', { name: stages[cur].name }); await rebuild(); }
  catch (e) { alert('지우지 못했어요: ' + e.message); }
};
load();
</script>
</body>
</html>
